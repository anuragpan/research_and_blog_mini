[project]
name = "research_and_blog_mini"
version = "0.1.0"
description = "research_and_blog_mini using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.30,<2.0.0"
]

[project.scripts]
research_and_blog_mini = "research_and_blog_mini.main:run"
run_crew = "research_and_blog_mini.main:run"
train = "research_and_blog_mini.main:train"
replay = "research_and_blog_mini.main:replay"
test = "research_and_blog_mini.main:test"
run_with_trigger = "research_and_blog_mini.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "eea52f7d-83f1-4a24-805a-a03dad1439c2"
